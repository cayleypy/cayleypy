name: Deploy docs

on:
  push:
    branches: [ main ]

jobs:
  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: 'x64'
      - name: Install CPU-only PyTorch
        run: python -m pip install "torch>=2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install requirements
        run: |
          sudo apt-get install pandoc
          pip install .[docs]
      - name: Build the docs
        run: docs/build_docs.sh
      - name: Push documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./docs/_build/html
          external_repository: cayleypy/cayleypy-docs
          publish_branch: gh-pages
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
