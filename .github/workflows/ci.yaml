name: Continuous integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install black
        run: pip install black
      - name: Run black
        run: black --check --diff .
  lint:
    name: Lint (black+pylint+mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install requirements
        run: pip install .[lint,test]
      - name: Lint
        run: ./lint.sh
  pytest-ubuntu:
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13' ]
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
      - name: Install requirements
        run: pip install .[test]
      - name: Run tests
        run: RUN_SLOW_TESTS=1 pytest
  pytest-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install requirements
        run: pip install .[test]
      - name: Run tests
        run: pytest
  pytest-macos:
    name: Tests (MacOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install requirements
        run: pip install .[test]
      - name: Run tests
        run: RUN_SLOW_TESTS=1 pytest
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install requirements
        run: |
          sudo apt-get install pandoc
          pip install .[docs]
      - name: Build the docs
        run: docs/build_docs.sh
  coverage:
    name: Coverage (core+algo >=90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install requirements
        run: pip install .[test,dev]
      - name: Run tests with coverage
        run: coverage run --branch -m pytest
      - name: Core+algo coverage gate (must be >=90%)
        run: |
          coverage report \
            --omit="cayleypy/puzzles/*,cayleypy/models/*,cayleypy/graphs_lib.py,cayleypy/datasets.py,cayleypy/data/*,*_test.py,*_benchmark.py" \
            --fail-under=90
      - name: Whole-package coverage (informational, never fails)
        run: coverage report || true
